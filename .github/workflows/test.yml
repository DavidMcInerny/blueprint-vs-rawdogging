name: Toolkit checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: node scripts/check-script-endings.mjs
      - run: npm ci --ignore-scripts
      - name: Toolkit suite (Linux)
        if: runner.os == 'Linux'
        run: npm test
      - name: Native PowerShell creation and additive installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: node --test tests/create-app.test.mjs tests/blueprint.test.mjs tests/portable-install.test.mjs tests/script-endings.test.mjs
      - name: Legacy shell bootstrap syntax
        if: runner.os == 'Linux'
        run: bash -n install.sh
      - run: git diff --check
