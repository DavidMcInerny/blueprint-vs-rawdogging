name: Native shell compilation and smoke
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-shell-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: starters/expo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: starters/expo/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - name: Compile Android release
        working-directory: starters/expo/android
        run: |
          # The cold all-ABI build exhausted the generated 512 MiB metaspace cap.
          # Bound concurrent workers without changing the generated ABI scope.
          set -o pipefail
          ./gradlew :app:assembleRelease --no-daemon --max-workers=2 --stacktrace --console=plain \
            '-Dorg.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1024m -XX:+ExitOnOutOfMemoryError -Dfile.encoding=UTF-8' \
            '-Pkotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1024m -XX:+ExitOnOutOfMemoryError' \
            2>&1 | tee ../build-android.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-native-build-log
          path: starters/expo/build-android.log
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-shell-local-signing-only
          path: starters/expo/android/app/build/outputs/apk/release/*.apk
          retention-days: 7
  ios:
    runs-on: macos-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: starters/expo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: starters/expo/package-lock.json
      - run: npm ci
      - run: npx expo prebuild --platform ios --no-install
      - run: pod install --project-directory=ios
      - name: Compile simulator release
        run: |
          workspace=$(node -e "const fs=require('node:fs'); const w=fs.readdirSync('ios').filter(n=>n.endsWith('.xcworkspace')); if(w.length!==1) throw Error('Expected one iOS workspace'); console.log('ios/'+w[0]);")
          scheme=$(basename "$workspace" .xcworkspace)
          xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO build > build-ios.log 2>&1
      - name: Boot and launch
        run: |
          xcrun simctl list devices available --json > devices.json
          device=$(node -e "const d=require('./devices.json'); console.log(Object.values(d.devices).flat().find(v=>v.name.startsWith('iPhone')).udid)")
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          app=$(node -e "const fs=require('node:fs'); const p='build/simulator/Build/Products/Release-iphonesimulator'; const a=fs.readdirSync(p).filter(n=>n.endsWith('.app')); if(a.length!==1) throw Error('Expected one built iOS app'); console.log(p+'/'+a[0]);")
          app_id=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")
          echo "APP_ID=$app_id" >> "$GITHUB_ENV"
          echo "IOS_DEVICE_ID=$device" >> "$GITHUB_ENV"
          xcrun simctl install "$device" "$app"
          xcrun simctl launch "$device" "$app_id"
          xcrun simctl io "$device" screenshot simulator-launch.png
      - name: Install pinned Maestro
        run: |
          curl -fsSL https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.10.0/maestro.zip -o maestro.zip
          curl -fsSL https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.10.0/checksums_sha256.txt -o checksums_sha256.txt
          shasum -a 256 -c checksums_sha256.txt
          unzip -q maestro.zip -d build/maestro
      - name: Native workflow smoke
        id: native-smoke
        run: |
          build/maestro/maestro/bin/maestro --device "$IOS_DEVICE_ID" test \
            --debug-output build/maestro-results --test-output-dir build/maestro-results \
            -e APP_ID="$APP_ID" e2e/native/smoke.yaml
      - name: Capture native smoke failure state
        if: failure() && steps.native-smoke.outcome == 'failure'
        timeout-minutes: 2
        run: |
          mkdir -p build/maestro-results
          xcrun simctl io "$IOS_DEVICE_ID" screenshot build/maestro-results/simulator-failure.png || true
          build/maestro/maestro/bin/maestro --device "$IOS_DEVICE_ID" hierarchy --no-reinstall-driver \
            > build/maestro-results/ui-hierarchy.json 2> build/maestro-results/ui-hierarchy.log || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ios-native-evidence
          path: |
            starters/expo/build-ios.log
            starters/expo/simulator-launch.png
            starters/expo/build/maestro-results/
          retention-days: 7
